id = "disenchanting_table"
name = "Dis-Enchanting Table"
version = "0.2.0"
description = """A port of Dis-Enchanting Table 5.0.2 for Horizon, slice 1: the Dis-Enchanting Table. One
block with a three-slot container (input, book, output) and a menu: a right click with an eligible
input, a book and an empty output slot strips the input's enchantments onto a fresh enchanted book
(an enchanted book keeps its first enchantment and gives the rest), spends one book and charges 25
experience points; the item itself is kept. Not yet ported: the server config file, the automatic
10-tick mode, the dis-enchant sound and portal particles, and the jar's GUI texture."""
authors = ["Lupin", "Jason13", "AdLf0208"]
license = "Unlicense"
homepage = "https://github.com/Mods-For-Lupin/Dis-Enchanting-Redux"
issues = "https://github.com/Mods-For-Lupin/Dis-Enchanting-Redux/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried assets/ and data/. The id is the resource namespace and the only identity:
# Cargo's package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not a hook's: the table runs on the server, and a LAN host or
# single-player world runs it inside the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). This mod's content declares a block, an item and a menu, so it is used, not just
# required.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
